[project]
name = "lex-eval"
version = "0.1.0"
description = "Evaluation harness for the Lex legal assistant (law.soufien.lu): scores answers per question type, verifies every quotation independently, and tracks each run in MLflow."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "mlflow>=2.16",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
lex-eval = "lex_eval.run:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
